schema_version: 1

context:
  name: recurring-ical-events
  version: "3.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/recurring_ical_events-${{ version }}.tar.gz
  sha256: e731af31d0b7dec5cd47a1defacd8549e2f36fab1c1995e8b9f042822a0acf8e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - icalendar >=6.1.0,<8.0.0
    - python-dateutil >=2.8.1,<3.0.0
    - x-wr-timezone >=1.0.0,<3.0.0
    - python-tzdata
    - typing-extensions

tests:
  - python:
      imports:
        - recurring_ical_events
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Python module which repeats ICalendar events by RRULE, RDATE and EXDATE.
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/niccokunzmann/python-recurring-ical-events

extra:
  recipe-maintainers:
    - tdido
